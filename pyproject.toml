[project]
name = "medshield"
version = "0.1.0"
description = "Bàn rà soát và che thông tin định danh trong ghi chú y tế"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sklearn-crfsuite>=0.5,<1",
  "python-crfsuite>=0.9.12,<1",
  "phonenumbers==9.0.40",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [".venv", "node_modules"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
